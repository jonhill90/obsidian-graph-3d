# Release workflow from Obsidian's "Release your plugin with GitHub Actions" page.
# There is no build step yet: main.js is committed as-is (see IMPORT.md).
# Publishes the release directly (no draft), so a tag push is the only manual step.
name: Release Obsidian plugin

on:
  push:
    tags:
      - "*"

jobs:
  release:
    runs-on: ubuntu-latest
    permissions:
      contents: write
      id-token: write
      attestations: write
    steps:
      - uses: actions/checkout@v4

      - name: Check tag equals manifest version
        run: |
          tag="${GITHUB_REF#refs/tags/}"
          version="$(jq -r .version manifest.json)"
          test "$tag" = "$version" || { echo "tag $tag does not match manifest version $version"; exit 1; }
          jq -e --arg v "$version" 'has($v)' versions.json > /dev/null || { echo "versions.json has no entry for $version"; exit 1; }

      - name: Generate artifact attestation
        uses: actions/attest@v4
        with:
          subject-path: |
            main.js
            manifest.json
            styles.css

      - name: Create release
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          tag="${GITHUB_REF#refs/tags/}"
          gh release create "$tag" \
            --title="$tag" \
            --generate-notes \
            main.js manifest.json styles.css
